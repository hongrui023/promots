# 云端构建 Android APK
#
# 为什么在 CI 里构建而不是本地：
#   Android 构建需要 JDK 17 + Android SDK（platform 34 + build-tools），
#   本地环境往往没有，装齐要 1～2 GB。GitHub 的 ubuntu runner 自带 Android SDK，
#   几分钟就能出一个可安装的 APK，比让每个人自己配环境划算得多。
#
# 签名策略：
#   用仓库内 .github/keystore/aiprompthub.p12 固定签名，**不使用 debug 签名**。
#   这样做的好处是每个版本的签名一致，手机上可以直接覆盖安装升级，
#   不需要「先卸载再装」（卸载会清掉本地数据）。
#
#   ⚠️ 这个密钥是公开的（就在仓库里），任何人都能用它签出可以覆盖安装的包。
#   个人自用没问题；**如果要上架应用商店，必须换一把私密密钥**。
#
# 不用 build.gradle 注入签名配置，而是 assembleRelease 出未签名包后
# 用 apksigner 补签——避免用脚本去改 Gradle 文件，那种做法很脆。

name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'capacitor.config.json'
      - '.github/workflows/android.yml'
      - '.github/keystore/**'
  # 发布 Release 时也构建一次，并把 APK 直接挂上去。
  # 注意：tags 不能与 push 平级写在 on: 下面，那样是无效的事件名，
  # 会让整个 workflow 解析失败（GitHub 会把工作流名显示成文件路径）。
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    name: 构建 APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # ---------------------------------------------------------------- 环境
      - name: 安装 Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 不用 android-actions/setup-android@v3：
      # 它内部会去装早已下架的 `tools` 包，报 "Failed to find package 'tools'"
      # 然后以退出码 1 失败。ubuntu runner 本来就预装了 Android SDK，
      # 直接用预装的 sdkmanager 补齐缺的包即可。
      - name: 准备 Android SDK
        run: |
          set -e
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "Android SDK 路径: $SDK"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          echo "--- SDK 顶层目录 ---"
          ls "$SDK" || true

          SDKMGR="$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -1)"
          echo "sdkmanager: ${SDKMGR:-未找到}"
          if [ -n "$SDKMGR" ]; then
            yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
            "$SDKMGR" "platforms;android-34" "build-tools;34.0.0" || \
              echo "(安装返回非零，若镜像已预装对应版本可忽略)"
          fi

          echo "--- 现有 build-tools ---"
          ls "$SDK/build-tools" || true
          echo "--- 现有 platforms ---"
          ls "$SDK/platforms" || true

      # ---------------------------------------------------------------- 门禁
      - name: 构建前先跑核心引擎自检
        run: node tools/verify.mjs

      # ---------------------------------------------------------------- 打包 Web 资源
      - name: 安装 Capacitor
        run: npm install --no-audit --no-fund @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6

      - name: 生成 Android 工程并把 app/ 同步进去
        run: |
          npx cap add android
          npx cap sync android
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          echo "--- local.properties ---"
          cat android/local.properties
          echo "--- 同步进来的 Web 资源 ---"
          ls android/app/src/main/assets/public/ | head -20

      # ---------------------------------------------------------------- 构建
      - name: Gradle 构建（未签名 release 包）
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: 查看产物
        run: find android/app/build/outputs -name "*.apk" -exec ls -la {} \;

      # ---------------------------------------------------------------- 签名
      - name: zipalign 并签名
        run: |
          set -e
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          echo "使用 build-tools: $BT"

          UNSIGNED="$(find android/app/build/outputs/apk/release -name '*unsigned*.apk' | head -1)"
          if [ -z "$UNSIGNED" ]; then
            UNSIGNED="$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)"
          fi
          echo "未签名包: $UNSIGNED"

          VERSION="$(node -p "require('./desktop/package.json').version")"
          OUT="AI-Prompt-Hub-${VERSION}.apk"

          "$BT/zipalign" -f -p 4 "$UNSIGNED" aligned.apk
          "$BT/apksigner" sign \
            --ks .github/keystore/aiprompthub.p12 \
            --ks-type PKCS12 \
            --ks-pass pass:aiprompthub \
            --key-pass pass:aiprompthub \
            --ks-key-alias aiprompthub \
            --out "$OUT" \
            aligned.apk

          echo "--- 校验签名 ---"
          "$BT/apksigner" verify --print-certs "$OUT"

          echo "--- 产物 ---"
          ls -la "$OUT"
          echo "APK_PATH=$OUT" >> "$GITHUB_ENV"
          echo "APK_NAME=$OUT" >> "$GITHUB_ENV"

      # ---------------------------------------------------------------- 验证
      - name: 确认 APK 结构完整
        run: |
          set -e
          echo "--- 包信息 ---"
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          if [ -x "$BT/aapt2" ]; then
            "$BT/aapt2" dump badging "$APK_NAME" 2>/dev/null | head -8 || \
              echo "(aapt2 dump badging 不可用，跳过，不影响产物)"
          fi

          echo "--- 包内是否含应用资源 ---"
          unzip -l "$APK_NAME" | grep -E "assets/public/(index.html|js/main.js|css/app.css)" || {
            echo "::error::APK 内没有找到应用资源，同步步骤可能失败"
            exit 1
          }

          echo "--- 拼音表是否完整进包 ---"
          unzip -l "$APK_NAME" | grep -q "assets/public/js/pinyin-data.js" || {
            echo "::error::拼音数据缺失，包不完整"
            exit 1
          }

          echo "包大小: $(du -h "$APK_NAME" | cut -f1)"

      - uses: actions/upload-artifact@v4
        with:
          name: ai-prompt-hub-apk
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 90

      # ---------------------------------------------------------------- 发版
      - name: 附加到 Release（仅由 release 事件触发时）
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APK_PATH }}
          generate_release_notes: true
