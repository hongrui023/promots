name: Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------- 自检
  verify:
    name: 核心引擎自检
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 运行 verify.mjs
        run: node tools/verify.mjs

      - name: 检查拼音表是否与生成器一致
        run: |
          npm install --no-audit --no-fund
          cp app/js/pinyin-data.js /tmp/pinyin-before.js
          npm run gen:pinyin
          if ! diff -q /tmp/pinyin-before.js app/js/pinyin-data.js > /dev/null; then
            echo "::error::app/js/pinyin-data.js 与 tools/gen-pinyin.js 的输出不一致，请重新执行 npm run gen:pinyin 并提交"
            exit 1
          fi
          echo "拼音表一致"

  # ---------------------------------------------------------------- Windows
  windows:
    name: Windows 桌面端
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装依赖
        working-directory: desktop
        run: npm install --no-audit --no-fund

      - name: 打包
        working-directory: desktop
        run: npx electron-builder --win --x64 --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 列出产物
        working-directory: desktop
        run: Get-ChildItem dist -Recurse -File | Select-Object FullName, Length

      - uses: actions/upload-artifact@v4
        with:
          name: ai-prompt-hub-windows
          path: |
            desktop/dist/*.exe
          if-no-files-found: error
          retention-days: 30

  # ---------------------------------------------------------------- 发布
  release:
    name: 发布 Release
    needs: [windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.exe
          generate_release_notes: true
